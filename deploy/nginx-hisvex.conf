# Reverse proxy for the Hisvex API. certbot rewrites this file in place to
# add the TLS block and the port-80 redirect, so keep it plain HTTP here.

upstream hisvex_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Product photos are uploaded through the API, and the default 1 MB cap
    # rejects a modern phone camera's JPEG with a bare 413 that the app shows
    # as a generic failure.
    client_max_body_size 25m;

    # Render's proxy terminated TLS and passed these through; the app trusts
    # X-Forwarded-* for rate limiting and logging, so they have to keep
    # arriving or every request appears to come from 127.0.0.1 and the
    # per-IP rate limiter starts throttling all tenants as one.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://hisvex_api;

        # A cold Atlas connection or a large sync can outlast the 60s default.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Kept out of the access log: the uptime check runs every minute and would
    # otherwise be the overwhelming majority of the log volume.
    location = /api/health {
        proxy_pass http://hisvex_api;
        access_log off;
    }

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;
}
